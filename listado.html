<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Listado de pizzas de Don Tomate.">
    <title>Pizzería Don Tomate | Listado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
  </head>
  <body>
    <!-- Encabezado con el menú principal del sitio -->
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm">
        <div class="container">
          <a class="navbar-brand fw-bold" href="index.html">Don Tomate</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
              <li class="nav-item"><a class="nav-link active" aria-current="page" href="listado.html">Listado</a></li>
              <li class="nav-item"><a class="nav-link" href="detalle.html">Detalle</a></li>
              <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
            </ul>
            <button class="btn btn-sm btn-outline-light ms-lg-3 theme-button" type="button" data-theme-toggle>Modo noche</button>
          </div>
        </div>
      </nav>
    </header>

    <main class="page-main">
      <!-- Título del catálogo y buscador para filtrar pizzas -->
      <section class="container section-pad">
        <div class="row align-items-end g-3 mb-4">
          <div class="col-lg-7">
            <p class="eyebrow">mini catálogo</p>
            <h1>Nuestras pizzas</h1>
            <p class="lead">Un listado simple para la primera evaluación. En la siguiente evaluación se puede conectar a una API de recetas o productos.</p>
          </div>
          <div class="col-lg-5">
            <label for="busquedaPizza" class="form-label visually-hidden">Buscar pizzas</label>
            <div class="input-group">
              <span class="input-group-text">Buscar</span>
              <input id="busquedaPizza" type="search" class="form-control" placeholder="Ej: queso, champiñón, picante">
            </div>
          </div>
        </div>

        <!-- Botones para filtrar por categoría -->
        <div class="filter-box mb-4">
          <button class="btn btn-brand btn-sm" type="button" data-filter="todas">Todas</button>
          <button class="btn btn-outline-brand btn-sm" type="button" data-filter="clasica">Clásicas</button>
          <button class="btn btn-outline-brand btn-sm" type="button" data-filter="vegetariana">Vegetarianas</button>
          <button class="btn btn-outline-brand btn-sm" type="button" data-filter="especial">Especiales</button>
        </div>

        <p id="resultadoFiltro" class="small text-muted">Mostrando 6 pizzas.</p>

        <!-- JavaScript arma este listado desde los datos dummy de main.js -->
        <div class="row g-4" id="catalogoPizzas"></div>
      </section>
    </main>

    <!-- Pie de página -->
    <footer class="site-footer">
      <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
        <p class="mb-0">Pizzería Don Tomate · Proyecto académico</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
